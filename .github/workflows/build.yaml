# .github/workflows/docker-build.yml
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix (optional, for caching)
        uses: cachix/cachix-action@v12
        with:
          name: your-cachix-cache-name
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
        continue-on-error: true

      - name: Build Docker image with Nix
        run: |
          nix-build docker.nix
          echo "IMAGE_PATH=$(readlink -f result)" >> $GITHUB_ENV

      - name: Load Docker image
        run: |
          docker load < $IMAGE_PATH

      - name: Get image name and tag
        id: image-info
        run: |
          IMAGE_NAME=$(docker images --format "{{.Repository}}:{{.Tag}}" | head -n 1)
          echo "image_name=$IMAGE_NAME" >> $GITHUB_OUTPUT
          echo "Loaded image: $IMAGE_NAME"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push ${{ steps.image-info.outputs.image_name }}

      - name: Tag and push latest (on main branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          docker tag ${{ steps.image-info.outputs.image_name }} yassinsiouda/akm-server:latest
          docker push yassinsiouda/akm-server:latest

      - name: Tag and push version (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          docker tag ${{ steps.image-info.outputs.image_name }} yassinsiouda/akm-server:$VERSION
          docker push yassinsiouda/akm-server:$VERSION
