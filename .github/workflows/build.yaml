name: Build and Push Docker Image

on:
  push:
    branches: [main, dev]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v24
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        run: |
          TAG=${{ github.ref == 'refs/heads/main' && 'latest' || 'dev' }}
          
          # Build with Nix
          nix-build docker.nix
          
          # Load the image and capture its exact name
          IMAGE_INFO=$(docker load < result)
          echo "Load output: $IMAGE_INFO"
          
          # Extract the loaded image name (format: "Loaded image: name:tag")
          LOADED_IMAGE=$(echo "$IMAGE_INFO" | grep -oP 'Loaded image: \K.*')
          echo "Loaded image: $LOADED_IMAGE"
          
          # Tag with your desired name
          docker tag "$LOADED_IMAGE" yassinsiouda/akm-server:$TAG
          
          # Push the correctly tagged image
          docker push yassinsiouda/akm-server:$TAG
